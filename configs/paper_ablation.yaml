project:
  name: rast_gru_rul_ablation
  seed: 42
  results_dir: results
  experiment_name: paper_ablation

data:
  root: data/raw
  subsets: [FD001, FD004]
  subset: FD001
  rul_cap: 125
  window_size: 30
  stride: 1
  validation_split: 0.2
  validation_last_strategy: simulated
  validation_last_min_rul: 1
  validation_last_max_rul: 125
  scaler: condition_standard
  condition_clusters:
    FD001: 1
    FD002: 6
    FD003: 1
    FD004: 6
  feature_mode: selected
  max_selected_sensors: 14
  include_settings: true
  append_missing_mask: true

model:
  name: rast_gru_v2
  hidden_size: 64
  tcn_channels: [48, 64]
  kernel_size: 3
  dropout: 0.15
  use_uncertainty_head: true

training:
  epochs: 80
  batch_size: 128
  learning_rate: 0.001
  weight_decay: 0.0001
  patience: 12
  num_workers: 0
  device: auto
  selection_metric: val_last_risk_score
  loss: asymmetric_weighted_huber
  huber_delta: 1.0
  late_life_threshold: 30
  late_life_weight: 1.25
  late_over_weight: 1.50
  smooth_late_risk_weight: 0.10
  smooth_late_risk_temperature: 2.0
  reliability_supervision_weight: 0.10
  consistency_weight: 0.05
  consistency_noise_std: 0.01
  quantile_calibration_weight: 0.10
  selection_lpr_weight: 0.25
  selection_severe_late_weight: 0.25

progress:
  console: true
  batch_bar: true

augmentation:
  seed: 42
  deterministic: true
  profile: missing_noise_drift
  train_noise_std: 0.01
  train_missing_rate: 0.10
  train_block_missing_rate: 0.08
  train_drift_rate: 0.03
  mechanism_apply_probability: 1.0
  corrupted_window_probability: 1.0
  train_sensor_dropout_prob: 0.0
  train_sensor_dropout_fraction: 0.0

robustness:
  noise_levels: [0.0, 0.03, 0.05, 0.10]
  missing_rates: [0.0, 0.20, 0.40]
  block_missing_rates: [0.20, 0.30]
  drift_rates: [0.05, 0.10]
  bias_levels: [0.10, 0.25, 0.50]
  stuck_at_rates: [0.10, 0.20, 0.30]
  burst_noise_levels: [0.10, 0.25, 0.50]
  correlated_missing_rates: [0.10, 0.20, 0.30]
