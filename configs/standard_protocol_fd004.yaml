project:
  name: standard_protocol_fd004
  seed: 42
  results_dir: results/standard_protocol_track
  experiment_name: standard_protocol_fd004

data:
  root: data/raw
  subsets: [FD004]
  subset: FD004
  rul_cap: 125
  window_size: 30
  stride: 1
  validation_split: 0.2
  validation_last_strategy: simulated
  validation_last_min_rul: 1
  validation_last_max_rul: 125
  scaler: standard
  condition_clusters:
    FD004: 1
  feature_mode: selected
  max_selected_sensors: 14
  include_settings: true
  append_missing_mask: false

model:
  name: rast_gru
  hidden_size: 64
  tcn_channels: [48, 64]
  kernel_size: 3
  dropout: 0.15
  use_uncertainty_head: false

training:
  epochs: 80
  batch_size: 128
  learning_rate: 0.001
  weight_decay: 0.0001
  patience: 12
  num_workers: 0
  device: auto
  selection_metric: val_last_rmse
  loss: huber
  huber_delta: 1.0
  late_life_threshold: 30
  late_life_weight: 1.0
  late_over_weight: 1.0
  smooth_late_risk_weight: 0.0
  reliability_supervision_weight: 0.0
  consistency_weight: 0.0
  quantile_calibration_weight: 0.0
  selection_lpr_weight: 0.0
  selection_severe_late_weight: 0.0

progress:
  console: true
  batch_bar: false

augmentation:
  mechanism_apply_probability: 1.0
  corrupted_window_probability: 1.0
  seed: 42
  deterministic: true
  profile: none
  train_noise_std: 0.0
  train_missing_rate: 0.0
  train_block_missing_rate: 0.0
  train_drift_rate: 0.0
  train_sensor_dropout_prob: 0.0
  train_sensor_dropout_fraction: 0.0

robustness:
  noise_levels: [0.0]
  missing_rates: [0.0]
  block_missing_rates: [0.0]
  drift_rates: [0.0]
